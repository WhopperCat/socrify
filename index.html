<!-- Syntax highlighting — theme swaps with dark mode via the script below -->
<link id="hljs-theme" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github.min.css" />
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/highlight.min.js"></script>
<script>
  // Swap hljs CSS when dark mode class changes on <html>
  (function () {
    var LIGHT = 'https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github.min.css';
    var DARK  = 'https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.min.css';
    function applyHljsTheme() {
      var link = document.getElementById('hljs-theme');
      if (link) link.href = document.documentElement.classList.contains('dark') ? DARK : LIGHT;
    }
    applyHljsTheme();
    new MutationObserver(applyHljsTheme)
      .observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
  })();
</script>

<script>
  // Apply saved theme synchronously before paint to avoid flash
  try {
    if (localStorage.getItem('socrify_theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
    if (localStorage.getItem('socrify_dyslexic') === '1') {
      document.body && document.body.classList.add('dyslexic');
    }
  } catch (e) {}
</script>
