name = "socrify"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Secrets (values never stored here — set once via: wrangler secret put <NAME>)
# ANTHROPIC_API_KEY
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# IP_HASH_SALT

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"
